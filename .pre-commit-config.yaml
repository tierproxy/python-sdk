repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
        files: ^sdks/python/
      - id: ruff-format
        files: ^sdks/python/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: ["pydantic>=2.6", "httpx>=0.27", "httpx-sse>=0.4", "types-requests", "mcp>=1.0"]
        args: [--strict, --config-file=sdks/python/pyproject.toml]
        files: ^sdks/python/src/tierproxy/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        files: ^sdks/python/
      - id: check-toml
        files: ^sdks/python/
      - id: end-of-file-fixer
        files: ^sdks/python/
      - id: trailing-whitespace
        files: ^sdks/python/
      - id: check-merge-conflict
        files: ^sdks/python/
