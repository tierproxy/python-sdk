name: Feature request
description: Propose a new feature or behaviour change.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to achieve?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: api
    attributes:
      label: Proposed API
      render: python
