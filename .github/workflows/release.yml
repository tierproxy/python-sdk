name: sdk-python release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Tag to publish (e.g. 0.3.1)
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    environment: pypi-sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="${{ inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches _version.py
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          VER=$(grep -E '^__version__\s*=\s*"' src/tierproxy/_version.py | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$TAG" != "$VER" ]; then
            echo "tag $TAG != _version.py $VER"
            exit 1
          fi

      - run: pip install build twine

      - name: Build distributions
        run: python -m build
        working-directory: .

      - name: Verify distributions
        run: twine check dist/*
        working-directory: .

      - name: Install CycloneDX
        run: pip install cyclonedx-bom

      - name: Install SDK for SBOM scan
        working-directory: .
        run: pip install -e .

      - name: Generate CycloneDX SBOM
        working-directory: .
        run: |
          cyclonedx-py environment --output-format json --output-file sbom.cdx.json
          cyclonedx-py environment --output-format xml --output-file sbom.cdx.xml

      - name: Attest SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-path: dist/*
          sbom-path: sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Sign distributions with Sigstore (post-publish)
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: |
            dist/*.tar.gz
            dist/*.whl

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            sbom.cdx.json
            sbom.cdx.xml
