name: SBOM

on:
  push:
    tags:
      - 'sdk-python-v*'
      - 'gateway-v*'
      - 'v*'
  workflow_dispatch:

jobs:
  sbom-python:
    if: startsWith(github.ref, 'refs/tags/sdk-python-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SDK
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install CycloneDX
        run: pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM (JSON)
        working-directory: .
        run: cyclonedx-py environment --output-format json --output-file sbom.cdx.json

      - name: Generate CycloneDX SBOM (XML)
        working-directory: .
        run: cyclonedx-py environment --output-format xml --output-file sbom.cdx.xml

      - name: Attest SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-path: sbom.cdx.json
          sbom-path: sbom.cdx.json

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.cdx.json
            sbom.cdx.xml

  sbom-gateway:
    if: startsWith(github.ref, 'refs/tags/gateway-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: gateway/go.sum

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate CycloneDX SBOM (Go)
        working-directory: gateway
        run: |
          syft . -o cyclonedx-json=sbom.cdx.json
          syft . -o cyclonedx-xml=sbom.cdx.xml

      - name: Attest SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-path: gateway/sbom.cdx.json
          sbom-path: gateway/sbom.cdx.json

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gateway/sbom.cdx.json
            gateway/sbom.cdx.xml
